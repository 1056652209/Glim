name: Desktop builds
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            arch: x86_64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --locked
      - name: Validate updater integration
        if: runner.os == 'macOS'
        run: |
          export GLIM_SPARKLE_DIR="$PWD/target/sparkle/2.10.0"
          scripts/fetch-sparkle.sh
          cargo clippy --workspace --all-targets --features macos-updater --locked -- -D warnings
          cargo test --workspace --features macos-updater --locked
          scripts/test-updater.sh
      - name: Validate Windows updater
        if: runner.os == 'Windows'
        env:
          GLIM_UPDATE_PUBLIC_KEY: ${{ vars.GLIM_UPDATE_PUBLIC_KEY }}
        run: |
          cargo clippy --workspace --all-targets --features windows-updater --locked -- -D warnings
          cargo test --workspace --features windows-updater --locked
      - name: Free validation build space before packaging
        if: runner.os == 'macOS'
        run: |
          cargo clean --profile dev
          df -h .
      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          GLIM_ENABLE_UPDATER: '1'
          GLIM_UPDATE_PUBLIC_KEY: ${{ vars.GLIM_UPDATE_PUBLIC_KEY }}
        run: scripts/package-dmg.sh ${{ matrix.arch }}
      - name: Package Windows
        if: runner.os == 'Windows'
        env:
          GLIM_ENABLE_UPDATER: '1'
          GLIM_UPDATE_PUBLIC_KEY: ${{ vars.GLIM_UPDATE_PUBLIC_KEY }}
        shell: pwsh
        run: scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Glim-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

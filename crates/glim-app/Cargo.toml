[package]
name = "glim-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "glim"
path = "src/main.rs"

[dependencies]
glim-core.workspace = true
glim-services.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
url = "2"
serde_json = "1"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = { version = "=0.54.1", default-features = false, features = ["os-webview", "protocol"] }
tao = { version = "=0.34.5", default-features = false, features = ["rwh_06"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true

    <rect x="264" y="344" width="130" height="44" rx="22" fill="#fff" fill-opacity=".85"/>
    <text x="286" y="372">Intel Mac</text>
    <rect x="406" y="344" width="216" height="44" rx="22" fill="#fff" fill-opacity=".85"/>
    <text x="428" y="372">Free &amp; open source</text>
  </g>
</g>
<g transform="translate(985 119)" fill="none">
  <rect x="18" y="0" width="164" height="224" rx="18" transform="rotate(9 100 112)" fill="#d9e9eb" stroke="#c6dcdf"/>
  <rect x="0" y="18" width="164" height="224" rx="18" transform="rotate(-6 82 130)" fill="#fff" fill-opacity=".9" stroke="#d2e1e3"/>
